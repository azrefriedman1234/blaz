name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TDLib bundle (from your URL)
        env:
          TDLIB_URL: ${{ secrets.TDLIB_URL }}
        run: |
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
      continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode=summary --console=plain 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Show error summary
        if: always()
        run: |
          echo "==== FIRST FAILURE BLOCK ===="
          grep -n -m1 -B2 -A40 "FAILURE: Build failed" build.log || true
          echo "==== FIRST * What went wrong ===="
          grep -n -m1 -B2 -A60 "\* What went wrong:" build.log || true
          echo "==== FIRST ERROR/Exception lines ===="
          grep -n -m1 -B2 -A60 "ERROR:|Exception|Caused by:" build.log || true



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
