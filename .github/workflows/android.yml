name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TDLib bundle (from your URL)
        env:
          TDLIB_URL: ${{ secrets.TDLIB_URL }}
        run: |
          test -n "$TDLIB_URL"
          mkdir -p app/src/main/jniLibs
          mkdir -p app/src/main/assets/tdlib
          echo "Downloading TDLib from: $TDLIB_URL"
          curl -L --retry 5 --retry-delay 2 -o /tmp/tdlib_bundle.zip "$TDLIB_URL"
          unzip -o /tmp/tdlib_bundle.zip -d /tmp/tdlib_bundle
          # דוגמא: תתאים לשמות אצלך בתוך ה-zip
          # מצופה: libtdjni.so ב-jniLibs/abi/
          cp -R /tmp/tdlib_bundle/jniLibs/* app/src/main/jniLibs/ || true
          cp -R /tmp/tdlib_bundle/assets/* app/src/main/assets/tdlib/ || true
          echo "TDLib bundle unpacked."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
