name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        continue-on-error: true
        run: |
          set -o pipefail
          set -o pipefail

          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

          echo "==== FIRST FAILURE BLOCK ===="

          # מדפיס רק את החלק הראשון שמסביר למה נפל

          awk \'BEGIN{p=0} /\:app\:.*FAILED/{p=1} p{print} /BUILD FAILED|FAILURE: Build failed/{exit}\' build.log || true

          echo "==== KOTLIN/ADBIND ERRORS (filtered) ===="

          grep -nE "e: file://|ERROR: <|Unresolved reference|Compilation error|ModuleVersionNotFoundException" build.log | head -n 200 || true

      - name: Show error summary
        if: always()
        run: |
          echo "==== FIRST FAILURE BLOCK ===="
          grep -n -m1 -B2 -A40 "FAILURE: Build failed" build.log || true
          echo "==== FIRST * What went wrong ===="
          grep -n -m1 -B2 -A80 "\* What went wrong:" build.log || true
          echo "==== FIRST ERROR/Exception/Caused by ===="
          grep -n -m1 -B2 -A120 "ERROR:|Exception|Caused by:" build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
